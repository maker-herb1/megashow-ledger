<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="판매대장">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>메가쇼 판매대장</title>
<style>
:root{--ink:#111827;--mute:#6b7280;--line:#e5e7eb;--bg:#eff1f3;--card:#fff;--top:#1f2937;--blue:#1d4ed8;--green:#047857;--violet:#6d28d9;--red:#b91c1c;--amber:#fef3c7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:var(--ink);background:var(--bg);touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column}
header{background:var(--card);color:var(--ink);padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.hl{display:flex;align-items:center;gap:6px;min-width:0}
#back{width:36px;height:36px;margin-right:4px;display:flex;align-items:center;justify-content:center;background:#eceef1;border:0;border-radius:9px;color:var(--ink);font-size:28px;font-weight:700;line-height:1;padding:0 2px 3px 0}
#back[hidden]{display:none}
#today{color:#374151}
header strong{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#today{font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
nav{display:flex;gap:3px;margin:8px 10px 2px;padding:3px;background:#dfe3e8;border-radius:11px}
nav button{flex:1;padding:8px 0;border:0;background:transparent;border-radius:8px;font-weight:600;font-size:16px;color:#4b5563}
nav button.on{background:#dbeafe;color:var(--blue);box-shadow:inset 0 0 0 2px var(--blue)}
main{flex:1;min-height:0;overflow:auto}
main.sale{overflow:hidden;display:flex;flex-direction:column}
.alert{background:var(--red);color:#fff;padding:8px 12px;font-size:14px}
.groups{flex:1;min-height:0;overflow:auto;padding:10px}
.groups h3{margin:12px 2px 6px;font-size:14px;font-weight:700;color:#374151}
.groups h3:first-child{margin-top:2px}
.grid{display:grid;grid-auto-rows:max-content;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.tile{position:relative;height:100%;min-height:76px;padding:10px 12px;background:#fff;border:1px solid #d7dbe0;border-radius:12px;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:4px}
.tile.in{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.tile:active{filter:brightness(.9)}
.tile .n{font-weight:700;font-size:17px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.3px}
.tile .p{font-size:17px;line-height:1.2;font-weight:400;white-space:nowrap;font-variant-numeric:tabular-nums}
.chk{position:absolute;right:10px;bottom:10px;width:22px;height:22px;border-radius:50%;background:var(--blue)}
.tile .p{padding-right:28px;overflow:hidden;text-overflow:ellipsis}
.tile .p small{font-size:13px;color:#6b7280;margin-left:2px}
.tile.other:disabled{color:#9ca3af}
.tile.other{background:#fff;border:1px dashed #9ca3af;justify-content:center;text-align:center;font-weight:600}
.foot{background:var(--card);border-top:2px solid #c8cdd5;padding:4px 12px calc(10px + env(safe-area-inset-bottom))}
.bar{width:100%;height:48px;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 16px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-size:18px;font-weight:400;white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{border:0}
.bar.center{justify-content:center}
.bar:disabled{background:#9ca3af}
.co{flex:1;min-height:0;overflow:auto;padding:10px;width:100%;max-width:640px;margin:0 auto}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto auto auto;align-items:center;column-gap:7px;padding:8px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .info{min-width:0;background:none;border:0;text-align:left;padding:0}
.line .info b{display:block;font-weight:600;font-size:19px;line-height:1.15;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line .info span{display:block;margin-top:3px;color:var(--mute);font-size:14px;line-height:1.15;white-space:nowrap;font-variant-numeric:tabular-nums}
.qb{width:38px;height:36px;padding:0;border:1px solid #d1d5db;background:#fff;border-radius:7px;font-size:17px;line-height:1}
.trash{width:26px;height:32px;padding:0;border:0;background:none;font-size:16px;line-height:1}
.line .trash{margin-left:6px}
.trash:active{filter:brightness(.8)}
.q{min-width:20px;text-align:center;font-weight:700}
.amt{min-width:54px;font-size:16px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
@media (max-width:375px){
 .line{column-gap:3px}
 .line .qb{width:33px}
 .line .q{min-width:17px}
 .line .trash{width:22px;margin-left:5px}
 .co .box:first-child{padding-left:8px;padding-right:8px}
}
.kv{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;font-variant-numeric:tabular-nums}
.kv .lb{color:#4b5563}
.dcin{width:50%;text-align:right;font-weight:700;color:var(--red);font-variant-numeric:tabular-nums}
.dcin::placeholder{color:#9ca3af;font-weight:400}
.gift{margin-left:6px;padding:4px 9px;height:30px;border:0;border-radius:6px;background:#f8ecc4;font-size:13px;font-weight:600;color:var(--ink)}
.gift.on{background:#f3e2a6;color:var(--ink)}
.minus,.minus td{color:var(--red);font-weight:600}
.sale-item.x .minus{color:inherit;font-weight:inherit}
.co .err{min-height:0;text-align:right}
.final{border-top:1px solid var(--line);margin-top:4px;padding:5px 0 0}
.final b{font-size:27px;font-weight:800;line-height:1.15}
.methods{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.method{height:40px;border:1px solid #d1d5db;background:#fff;border-radius:9px;font-size:15px;font-weight:600}
.method.on{font-weight:700;border-width:2px}
.method.m0.on{border-color:var(--blue);background:#dbeafe;color:var(--blue)}
.method.m1.on{border-color:var(--green);background:#d1fae5;color:var(--green)}
.method.m3.on{border-color:transparent;background:#f8ecc4;color:var(--ink)}
.method.m2.on{border-color:var(--violet);background:#ede9fe;color:var(--violet)}
.memo{width:100%;margin-top:6px}
.dcin,.memo{height:40px;padding:4px 10px;font-size:15px}
#toast{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:420px;margin:auto;background:#e8edf5;color:#111827;border:1px solid #b8c4d6;padding:5px 6px 5px 12px;font-size:15px;border-radius:9px;display:none;justify-content:space-between;align-items:center;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:5}
#toast.on{display:flex}
#toast button{background:#fff;color:var(--blue);border:1px solid #b8c4d6;border-radius:7px;padding:5px 10px;font-size:14px;font-weight:600;white-space:nowrap}
.page{padding:12px;max-width:760px;margin:auto}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.box h2{font-size:16px;margin:0 0 8px}
.hint{color:var(--mute);font-size:14px;margin:4px 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{padding:11px 14px;border:1px solid #d1d5db;background:#fff;border-radius:8px;font-weight:600}
.btn.save,select.save{border-color:#d1d5db;background:#d9f2e3;color:var(--ink)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.on{background:var(--blue);border-color:var(--blue);color:#fff}
select,input,textarea{padding:10px;border:1px solid #d1d5db;border-radius:8px;background:#fff;max-width:100%}
textarea{width:100%;min-height:210px}
input.full{width:100%}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:7px 5px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:14px;color:var(--mute);font-weight:600}
td.r,th.r{text-align:right}
tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
.sale-item{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.sale-item .top{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-variant-numeric:tabular-nums}
.sale-item .sub{color:var(--mute);font-size:14px;overflow-wrap:anywhere}
.sale-item.x .top,.sale-item.x .sub{text-decoration:line-through;color:#9ca3af}
.tag{font-size:13px;font-weight:600;color:var(--mute)}
.diff-ok{color:var(--green);font-weight:700}.diff-no{color:var(--red);font-weight:700}
.fld{flex:1;min-width:140px;font-size:14px;color:var(--mute)}
.fld input{margin-top:3px;text-align:right;color:var(--ink);width:100%}
dialog{border:0;border-radius:14px;padding:16px;width:min(92vw,420px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 10px;font-size:18px}
dialog label{display:block;margin-bottom:10px;font-size:14px;color:var(--mute)}
dialog label input{display:block;width:100%;margin-top:4px;font-size:18px;color:var(--ink)}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.err{color:var(--red);font-size:14px;margin:0;min-height:20px}
#print{display:none}
@media print{
 @page{size:A4;margin:12mm}
 html,body{height:auto;background:#fff}
 #app,#toast,dialog{display:none!important}
 #print{display:block;font-size:11pt}
 #print h1{font-size:16pt;margin:0 0 2mm}
 #print h2{font-size:12pt;margin:6mm 0 2mm}
 #print th,#print td{border:1px solid #555;padding:1.2mm 2mm;color:#000}
 #print tr{break-inside:avoid}
 #print thead{display:table-header-group}
 #print .x td{text-decoration:line-through;color:#777}
}
</style>
</head>
<body>
<div id="app">
  <header><span class="hl"><button id="back" data-a="closeCheckout" aria-label="상품 화면으로" hidden>‹</button><strong id="title"></strong></span><span id="today"></span></header>
  <nav id="tabs"></nav>
  <main id="view"></main>
</div>
<div id="toast" role="status"><span id="toastMsg"></span><button data-a="undo">되돌리기</button></div>
<dialog id="dlg"></dialog>
<div id="print"></div>
<input type="file" id="importFile" accept=".json,.txt,.csv,application/json,text/plain,text/csv" hidden>
<script>
(() => {
'use strict';
const APP_VERSION = '2026-11-06.24';
const KEY = 'megashow-ledger-v1';
const PAYS = ['카드', '현금', '계좌이체'];
const TABS = [['sale', '판매'], ['history', '내역'], ['close', '마감'], ['settings', '설정']];
const DISCOUNT = '__discount';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => Number(n).toLocaleString('ko-KR');
const two = n => String(n).padStart(2, '0');
const dateOf = ts => { const d = new Date(ts); return `${d.getFullYear()}-${two(d.getMonth()+1)}-${two(d.getDate())}`; };
const timeOf = ts => { const d = new Date(ts); return `${two(d.getHours())}:${two(d.getMinutes())}`; };
const today = () => dateOf(Date.now());
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
const money = s => { const t = String(s).replace(/[,\s원]/g, ''); return /^\d+$/.test(t) ? Number(t) : NaN; };

// 202612_수원메가쇼 제품판매가.PNG 기준: 제품명, 메가쇼 판매가
const PRODUCTS = [
  ['도라지농축(60포)',29000],['도라지환(30포)',26000],['라이블리Q(60포)',54000],['맨피던스110(60포)',54000],
  ['상황버섯농축(60포)',65000],['속풀강황(60포)',20000],['실속있는강황환, 250g',20000],['실속있는도라지환, 280g',26000],
  ['실속있는양배추환, 250g',20000],['실속있는여주환, 280g',26000],['양배추환(60포)',35000],['양배추농축(60포)',42000],
  ['여주환(30포)',26000],['우슬즙(30포)',23000],['벌나무헛개즙(30포)',23000],['청안비결(60포)',36000],
  ['전통쌍화차(20포)',29000],['전통쌍화차고명(20포)',7000],['청한차(20포)',25000]];
function fresh() {
  return { eventName:'수원메가쇼', device:'', products:PRODUCTS.map(([name,price]) => ({id:uid(),name,price})),
    sales:[], cart:[], recon:{}, lastBackup:0, method:'카드', memo:'',
    syncUrl:'', syncKey:'', outbox:{}, syncOk:0, syncErr:'' };
}
let state, storageFailed = false;
function load() {
  const raw = localStorage.getItem(KEY);
  if (!raw) { state = fresh(); return; }
  try { state = Object.assign(fresh(), JSON.parse(raw)); }
  catch (e) { localStorage.setItem(KEY + '-corrupt-' + Date.now(), raw); state = fresh(); }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); storageFailed = false; }
  catch (e) { storageFailed = true; }
}

let checkout = false, tab = 'sale', histDate = null, closeDate = null, undoInfo = null, toastTimer = null;

/* ---------- 공통 ---------- */
function cartTotal() { return state.cart.reduce((a, l) => a + l.qty * l.price, 0); }
// 증정은 결제수단 "증정"으로만 판단합니다. 메모는 건드리지 않습니다.
function isGift() { return state.method === '증정'; }
function itemsSum() { return state.cart.filter(l => l.key !== DISCOUNT).reduce((a, l) => a + l.qty * l.price, 0); }
// 증정이면 수량·단가가 바뀌어도 할인을 상품 합계와 같게 맞춰 0원을 유지합니다.
function fixMethod() { if (isGift()) setDiscount(itemsSum()); }
function canPay() { return state.cart.some(l => l.key !== DISCOUNT) && cartTotal() >= 0; }
function matches(s, d) { return d === 'all' || s.date === d; }
function salesOf(d) { return state.sales.filter(s => matches(s, d)).sort((a, b) => a.ts - b.ts); }
function activeOf(d) { return salesOf(d).filter(s => !s.canceled); }
function allDates() { const set = new Set(state.sales.map(s => s.date)); set.add(today()); return [...set].sort().reverse(); }
function byPay(list) { const o = {}; PAYS.forEach(p => o[p] = 0); list.forEach(s => o[s.pay] = (o[s.pay] || 0) + s.total); return o; }
function sumOf(list) { return list.reduce((a, s) => a + s.total, 0); }
function byProduct(list) {
  const m = new Map();
  list.forEach(s => s.items.forEach(i => {
    const r = m.get(i.name) || {name:i.name, qty:0, amount:0, discount:i.key === DISCOUNT};
    r.qty += i.qty; r.amount += i.qty * i.price; m.set(i.name, r);
  }));
  return [...m.values()].sort((a, b) => (a.discount - b.discount) || (b.amount - a.amount));
}
function dateOptions(sel, withAll) {
  return allDates().map(d => `<option value="${d}"${d===sel?' selected':''}>${d}${d===today()?' (오늘)':''}</option>`).join('')
    + (withAll ? `<option value="all"${sel==='all'?' selected':''}>전체 기간</option>` : '');
}
function itemsHtml(s) { return s.items.map(i => i.key === DISCOUNT ? `<span class="minus">할인 ${won(i.price)}</span>` : `${esc(i.name)} ×${i.qty}`).join(', '); }

/* ---------- 렌더 ---------- */
function renderChrome() {
  $('title').textContent = checkout ? '결제 확인' : state.eventName + (state.device ? ' · ' + state.device : '');
  $('back').hidden = !checkout;
  $('today').hidden = checkout;
  $('tabs').hidden = checkout;
  $('tabs').style.display = checkout ? 'none' : '';
  const a = activeOf(today());
  $('today').textContent = `오늘 ${a.length}건 · ${won(sumOf(a))}원`;
  $('tabs').innerHTML = TABS.map(([k, v]) => `<button data-a="tab" data-v="${k}" class="${k===tab?'on':''}">${v}</button>`).join('');
}
function render() {
  renderChrome();
  ({sale:renderSale, history:renderHistory, close:renderClose, settings:renderSettings})[tab]();
}
function keepScroll(sel, fn) {
  const old = document.querySelector(sel), top = old ? old.scrollTop : 0;
  fn();
  const now = document.querySelector(sel);
  if (now) now.scrollTop = top;
}
function storageAlert() { return storageFailed ? '<div class="alert">저장에 실패했습니다. 지금 바로 마감 화면에서 파일로 내보내세요.</div>' : ''; }
// 상품명으로 묶음과 바탕색을 정합니다.
const GROUPS = ['차', '농축', '환', '기타'];   // 상품 화면에 보여 주는 묶음 순서
function groupOf(name) {
  if (name.includes('농축')) return '농축';
  if (/차|우슬즙|헛개즙|청안비결/.test(name)) return '차';
  if (/환|라이블리|맨피던스|속풀강황/.test(name)) return '환';
  return '기타';
}
// 상품 칸은 한 줄 이름 + "금액 · 포수/용량"으로 나눕니다. 기록에는 전체 이름이 남습니다.
function splitName(name) {
  const m = name.match(/^(.+?)\s*(?:\(([^()]+)\)|,\s*(.+))$/);
  return m ? {base: m[1], spec: m[2] || m[3]} : {base: name, spec: ''};
}
// 결제 확인 화면에는 더 짧은 이름을 씁니다.
function shortName(name) {
  const m = name.match(/^(.+?)(?:\(([^()]+)\)|,\s*(.+))$/);
  return (m ? m[1] : name).replace(/^실속있는/, '실속').replace(/^전통쌍화차고명/, '쌍화차고명');
}
function renderSale() {
  if (checkout) { if (state.cart.length) return renderCheckout(); closeCheckout(); }
  const v = $('view'); v.className = 'sale';
  const qty = {}; state.cart.forEach(l => qty[l.key] = l.qty);
  // 상품 칸: 흰 상자, 차 → 농축 → 환 순서로 모아 배치(묶음 안은 제품 목록 순서), 포수·용량이 있는 전체 이름을 굵게.
  // 선택하면 얇은 파란 테두리와 오른쪽 위 파란 체크가 붙고, 다시 누르면 해제됩니다. 수량은 결제 확인 화면에서 바꿉니다.
  const tile = p => { const {base, spec} = splitName(p.name); return `<button class="tile${qty[p.id]?' in':''}" data-a="add" data-v="${esc(p.id)}">
      <span class="n">${esc(base)}</span><span class="p">${won(p.price)}원${spec?`<small>· ${esc(spec)}</small>`:''}</span>
      ${qty[p.id]?'<svg class="chk" viewBox="0 0 24 24" aria-label="선택됨"><path d="M6 12.5l4 4L18 8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>':''}</button>`; };
  const ordered = GROUPS.flatMap(g => state.products.filter(p => groupOf(p.name) === g));
  const sections = `<div class="grid">${ordered.map(tile).join('')}<button class="tile other" data-a="custom">+ 직접 입력</button><button class="tile other" data-a="clear"${state.cart.length?'':' disabled'}>선택 해제</button></div>`;
  const count = state.cart.filter(l => l.key !== DISCOUNT).reduce((a, l) => a + l.qty, 0);
  keepScroll('.groups', () => {

function form(o) {
  return new Promise(res => {
    const dlg = $('dlg');
    dlg.innerHTML = `<form novalidate><h2>${esc(o.title)}</h2>
      ${o.fields.map(f => `<label>${esc(f.label)}<input name="${f.name}" value="${esc(f.value ?? '')}"${f.numeric?' inputmode="numeric"':''} autocomplete="off"></label>`).join('')}
      <p class="err"></p><div class="dlg-actions">
      ${o.extra?`<button type="button" class="btn danger" data-x>${esc(o.extra)}</button>`:''}
      <button type="button" class="btn" data-c>닫기</button><button class="btn primary">확인</button></div></form>`;
    const f = dlg.querySelector('form');
    let done = false;
    const finish = v => { if (done) return; done = true; dlg.close(); res(v); };
    f.onsubmit = e => {
      e.preventDefault();
      const vals = Object.fromEntries(new FormData(f));
      const err = o.validate ? o.validate(vals) : null;
      if (err) f.querySelector('.err').textContent = err; else finish(vals);
    };
    f.querySelector('[data-c]').onclick = () => finish(null);
    const x = f.querySelector('[data-x]'); if (x) x.onclick = () => finish('extra');
    dlg.oncancel = e => { e.preventDefault(); finish(null); };
    dlg.showModal();
    const first = f.querySelector('input'); if (first) { first.focus(); first.select(); }
  });
}

/* ---------- 파일 ---------- */
function csvCell(v) {
  let s = String(v ?? '');
  if (typeof v === 'string' && /^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function buildCsv(d) {
  const out = [['행사','날짜','시간','거래번호','품목','수량','단가','금액','결제수단','판매대','상태','메모']];
  const seq = {};
  salesOf(d).forEach(s => {
    seq[s.date] = (seq[s.date] || 0) + 1;
    s.items.forEach(i => out.push([state.eventName, s.date, timeOf(s.ts), seq[s.date], i.name, i.qty, i.price, i.qty*i.price, s.pay, s.device||'', s.canceled?'취소':'정상', s.memo||'']));
  });
  return '﻿' + out.map(r => r.map(csvCell).join(',')).join('\r\n');
}
function fileName(d, ext) { return `${state.eventName}_판매대장_${d==='all'?'전체':d}${state.device?'_'+state.device:''}.${ext}`.replace(/[\\/:*?"<>|\s]+/g,'_'); }

/* ---------- 구글 시트 자동 전송 ---------- */
let syncing = false, syncTimer = null;
function queueSync(sale) { state.outbox[sale.id] = JSON.parse(JSON.stringify(sale)); scheduleSync(300); }
function scheduleSync(ms) { clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, ms); }
function outboxCount() { return Object.keys(state.outbox || {}).length; }
async function syncNow() {
  if (syncing || !state.syncUrl || !outboxCount() || navigator.onLine === false) return;
  syncing = true;
  const batch = Object.values(state.outbox).slice(0, 50);
  try {
    const r = await fetch(state.syncUrl, {method:'POST', body: JSON.stringify({app:'megashow-ledger', key:state.syncKey, event:state.eventName, sales:batch})});
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '시트가 거부했습니다.');
    batch.forEach(b => { const cur = state.outbox[b.id]; if (cur && cur.updatedAt === b.updatedAt) delete state.outbox[b.id]; });
    state.syncOk = Date.now(); state.syncErr = '';
  } catch (e) {
    state.syncErr = (e && e.message) || '전송 실패';
    scheduleSync(30000);
  }
  syncing = false; save(); renderSyncStatus();
  if (outboxCount() && !state.syncErr) scheduleSync(300);
}
function syncStatusText() {
  if (!state.syncUrl) return '자동 전송 꺼짐. 설정 화면에서 전송 주소를 넣으세요.';
  const n = outboxCount();
  const last = state.syncOk ? `마지막 전송 ${timeOf(state.syncOk)}` : '아직 전송한 적 없음';
  return (n ? `미전송 ${n}건` : '모두 전송됨') + ' · ' + last + (state.syncErr ? ` · 오류: ${state.syncErr}` : '');
}
function renderSyncStatus() { document.querySelectorAll('.syncStatus').forEach(el => el.textContent = syncStatusText()); }
window.addEventListener('online', () => scheduleSync(500));
setInterval(() => { if (outboxCount()) syncNow(); }, 60000);

    <h2>제품별 판매</h2><table><thead><tr><th>품목</th><th class="r">수량</th><th class="r">금액</th></tr></thead><tbody>
    ${byProduct(act).map(x=>`<tr><td>${esc(x.name)}</td><td class="r">${x.discount?'':won(x.qty)}</td><td class="r">${won(x.amount)}</td></tr>`).join('')}</tbody></table>
    <h2>거래 내역</h2><table><thead><tr><th>시간</th><th class="r">번호</th><th>품목</th><th class="r">수량</th><th class="r">단가</th><th class="r">금액</th><th>결제</th></tr></thead><tbody>${rows}</tbody>
    <tfoot><tr><td colspan="5">합계 (취소선 거래 제외)</td><td class="r">${won(sumOf(act))}</td><td></td></tr></tfoot></table>`;
}
function validSale(s) {
  return s && typeof s.id === 'string' && Number.isFinite(s.ts) && Number.isFinite(s.total) && typeof s.date === 'string' && typeof s.pay === 'string'
    && Array.isArray(s.items) && s.items.every(i => i && typeof i.name === 'string' && Number.isFinite(i.qty) && Number.isFinite(i.price));
}
function importBackup(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { alert('백업 파일을 읽을 수 없습니다.'); return; }
  if (!data || data.app !== 'megashow-ledger' || !Array.isArray(data.sales) || !data.sales.every(validSale)) { alert('이 앱의 백업 파일이 아닙니다.'); return; }
  let added = 0, updated = 0;
  data.sales.forEach(s => {
    const i = state.sales.findIndex(x => x.id === s.id);
    if (i < 0) { state.sales.push(s); queueSync(s); added++; }
    else if ((s.updatedAt || s.ts) > (state.sales[i].updatedAt || state.sales[i].ts)) { state.sales[i] = s; queueSync(s); updated++; }
  });
  Object.entries(data.recon || {}).forEach(([k, v]) => { if (!state.recon[k]) state.recon[k] = v; });
  // 제품 목록은 바꾸지 않습니다. 기기마다 같은 목록을 쓰므로 판매 기록만 합칩니다.
  save(); render();
  alert(`기록 ${added}건을 새로 추가하고 ${updated}건을 갱신했습니다.`);
}

/* ---------- 동작 ---------- */
function closeCheckout() {
  if (!checkout) return;
  checkout = false;
  if (history.state && history.state.checkout) history.back();
}
function setDiscount(n) {
  state.cart = state.cart.filter(l => l.key !== DISCOUNT);
  if (n > 0) state.cart.push({key:DISCOUNT, name:'할인', qty:1, price:-n});
}
function updateCheckoutTotals() {
  const total = cartTotal();
  $('finalAmt').textContent = won(total) + '원';
  $('payBtn').textContent = state.method + ' ' + won(total) + '원 판매 완료';
  $('payBtn').disabled = !canPay();
  $('dcErr').textContent = total < 0 ? '할인이 상품 합계보다 큽니다.' : '';
}
function dropOrphanDiscount() { if (!state.cart.some(l => l.key !== DISCOUNT)) state.cart = []; }
const actions = {
  tab(v) { tab = v; hideToast(); render(); },
  add(id) {
    const p = state.products.find(x => x.id === id); if (!p) return;
    hideToast();
    const i = state.cart.findIndex(x => x.key === id);
    if (i >= 0) { state.cart.splice(i, 1); dropOrphanDiscount(); }
    else state.cart.push({key:id, name:p.name, qty:1, price:p.price});
    save(); render();
  },
  inc(i) { state.cart[i].qty++; save(); render(); },
  dec(i) { const l = state.cart[i]; if (--l.qty < 1) state.cart.splice(i, 1); dropOrphanDiscount(); save(); render(); },
  rm(i) { state.cart.splice(i, 1); dropOrphanDiscount(); save(); render(); },
  clear() { state.cart = []; state.memo = ''; save(); closeCheckout(); render(); },
  gift() {
    if (isGift()) { state.method = '카드'; setDiscount(0); }
    else { state.method = '증정'; setDiscount(itemsSum()); }
    save(); render();
  },
  openCheckout() { hideToast(); checkout = true; history.pushState({checkout:true}, ''); render(); document.querySelector('.co').scrollTop = 0; },
  closeCheckout() { closeCheckout(); render(); },
  setMethod(m) { state.method = m; save(); render(); },
  async custom() {
    const v = await form({title:'직접 입력', fields:[{name:'name',label:'품목 (비워두면 기타)'},{name:'price',label:'단가',numeric:true},{name:'qty',label:'수량',value:'1',numeric:true}],
      validate: x => Number.isNaN(money(x.price)) ? '단가를 숫자로 입력하세요.' : (!(money(x.qty) >= 1) ? '수량은 1 이상이어야 합니다.' : null)});
    if (!v) return;
    hideToast();
    state.cart.push({key:'custom-'+uid(), custom:true, name:v.name.trim()||'기타', qty:money(v.qty), price:money(v.price)});
    save(); render();
  },
  async editLine(i) {
    const l = state.cart[i];
    const v = await form({title:shortName(l.name), extra:'삭제', fields:[{name:'qty',label:'수량',value:l.qty,numeric:true},{name:'price',label:'단가',value:l.price,numeric:true}],
      validate: x => !(money(x.qty) >= 1) ? '수량은 1 이상이어야 합니다.' : (Number.isNaN(money(x.price)) ? '단가를 숫자로 입력하세요.' : null)});
    if (!v) return;
    if (v === 'extra') state.cart.splice(i, 1);
    else { l.qty = money(v.qty); l.price = money(v.price); }
    dropOrphanDiscount(); save(); render();
  },
  pay() {
    if (!canPay()) return;
    const method = state.method, memo = state.memo.trim();
    const now = Date.now(), snapshot = state.cart.map(l => ({...l}));
    const sale = {id:uid(), ts:now, updatedAt:now, date:dateOf(now), items:snapshot, total:cartTotal(), pay:method, device:state.device, canceled:false, memo};
    state.sales.push(sale); state.cart = []; state.method = '카드'; state.memo = '';
    queueSync(sale); save(); closeCheckout(); render();
    if (navigator.vibrate) navigator.vibrate(40);
    showToast(`${method} ${won(sale.total)}원 기록됨`, {id:sale.id, cart:snapshot, method, memo});
  },
  undo() {
    if (!undoInfo) return;
    const {id, cart, method, memo} = undoInfo;
    state.sales = state.sales.filter(s => s.id !== id);
    state.cart = cart; state.method = method; state.memo = memo;
    queueSync({id, deleted:true, updatedAt:Date.now()}); hideToast(); save(); render();
  },
  saleDetail,
  csv() { download(fileName(closeDate,'csv'), buildCsv(closeDate), 'text/csv;charset=utf-8'); },
  print() { buildPrint(closeDate); window.print(); },
  backup() {
    const b = backupData();
    download(b.name, b.text, 'application/json');
    state.lastBackup = b.now; save(); render();
  },
  saveProducts() {
    const lines = $('prodText').value.split(/\r?\n/).map(s => s.trim()).filter(Boolean), out = [], seen = new Set();
    for (let i = 0; i < lines.length; i++) {
      const m = lines[i].match(/^(.+?)[,\t ]+(\d{1,3}(?:,\d{3})+|\d+)\s*원?$/);
      const name = m && m[1].trim(), price = m ? money(m[2]) : NaN;
      if (!m || Number.isNaN(price)) { $('prodErr').textContent = `${i+1}번째 줄을 확인하세요: ${lines[i]}`; return; }
      if (seen.has(name)) { $('prodErr').textContent = `제품명이 중복됩니다: ${name}`; return; }
      seen.add(name);
      const old = state.products.find(p => p.name === name);
      out.push({id: old ? old.id : uid(), name, price});
    }
    if (!out.length) { $('prodErr').textContent = '제품을 한 개 이상 입력하세요.'; return; }
    state.products = out;
    state.cart = state.cart.filter(l => l.key === DISCOUNT || l.custom || out.some(p => p.id === l.key));
    dropOrphanDiscount(); save(); render(); showToast('제품 목록을 저장했습니다.');
  },
  saveSync() {
    state.syncUrl = $('syncUrl').value.trim(); state.syncKey = $('syncKey').value.trim();
    if (state.syncUrl && !/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(state.syncUrl)) { alert('전송 주소는 https://script.google.com/macros/s/…/exec 형태여야 합니다.'); return; }
    if (state.syncUrl) state.sales.forEach(x => { state.outbox[x.id] = JSON.parse(JSON.stringify(x)); });
    state.syncErr = ''; save(); render();
    showToast(state.syncUrl ? `자동 전송을 켰습니다. 기존 기록 ${state.sales.length}건도 보냅니다.` : '자동 전송을 껐습니다.');
    if (state.syncUrl) scheduleSync(300);
  },
  async testSync() {
    const url = $('syncUrl').value.trim(), key = $('syncKey').value.trim();
    if (!url) { alert('전송 주소를 먼저 넣으세요.'); return; }
    try {
      const r = await fetch(url, {method:'POST', body: JSON.stringify({app:'megashow-ledger', key, ping:true})});
      const j = await r.json();
      alert(j.ok ? `연결됐습니다. 시트: ${j.sheet || ''}` : `연결 실패: ${j.error || '시트가 거부했습니다.'}`);
    } catch (e) { alert('연결 실패: ' + (e.message || '주소를 확인하세요.')); }
  },
  syncNow() { if (!state.syncUrl) { alert('전송 주소를 먼저 넣고 저장하세요.'); return; } state.syncErr = ''; syncNow(); showToast('전송 중…'); },
  saveInfo() { state.eventName = $('evName').value.trim() || '판매대장'; state.device = $('devName').value.trim(); save(); render(); showToast('저장했습니다.'); },
  import() { $('importFile').click(); },
  wipe() {
    const a = prompt(`판매 기록 ${state.sales.length}건을 모두 지웁니다. 계속하려면 삭제 라고 입력하세요.`);
    if (a !== '삭제') return;
    state.sales = []; state.recon = {}; state.cart = []; state.lastBackup = 0; state.outbox = {}; save(); render(); showToast('판매 기록을 지웠습니다. 구글 시트에 이미 보낸 기록은 시트에서 직접 지우세요.');
  },
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  const f = actions[b.dataset.a]; if (!f) return;
  const v = b.dataset.v;
  f(/^(inc|dec|rm|editLine)$/.test(b.dataset.a) ? Number(v) : v);
});
document.addEventListener('change', e => {
  if (e.target.id === 'dcInput') { const n = money(e.target.value); e.target.value = n ? won(n) : ''; return; }
  const c = e.target.dataset && e.target.dataset.c;
  if (c === 'histDate') { histDate = e.target.value; render(); }
  if (c === 'closeDate') { closeDate = e.target.value; render(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'memo') { state.memo = e.target.value; save(); return; }
  if (e.target.id === 'dcInput') {
    e.target.value = e.target.value.replace(/[^\d,]/g, '');
    setDiscount(money(e.target.value) || 0);
    save(); updateCheckoutTotals(); return;
  }
  const k = e.target.dataset && e.target.dataset.r; if (!k) return;
  (state.recon[closeDate] = state.recon[closeDate] || {})[k] = e.target.value;
  save(); renderReconResult(closeDate);
});
$('importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (f) importBackup(await f.text());
});
window.addEventListener('popstate', () => { if (checkout) { checkout = false; render(); } });
window.addEventListener('storage', e => { if (e.key === KEY) { load(); render(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden) renderChrome(); });

load(); render();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
// 파일로 직접 열 때는 브라우저가 설정 파일을 막으므로 웹 주소일 때만 연결합니다.
if (location.protocol !== 'file:') { const m = document.createElement('link'); m.rel = 'manifest'; m.href = 'manifest.webmanifest'; document.head.appendChild(m); }
scheduleSync(1500);
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
